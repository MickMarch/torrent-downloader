name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    # Shared quality gate; step order and tool versions live in the workspace repo.
    uses: MickMarch/medialab/.github/workflows/python-ci.yml@main
    with:
      exclude-audit-package: medialab-contracts
      # diskcache CVE-2025-69872 has no fixed release yet; revisit when one ships.
      audit-ignore-vulns: CVE-2025-69872
